[project]
name = "cph"
version = "0.1.4.0"
description = "A simple helper script for competitive programming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.20.0"]

[project.scripts]
cph = "cph.main:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"
