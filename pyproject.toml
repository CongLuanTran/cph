[project]
name = "cph"
version = "0.2.0.0"
description = "A simple helper script for competitive programming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "codeforcesapipy>=2.0.12",
  "typer>=0.20.0",
  "xdg-base-dirs>=6.0.2",
]

[project.scripts]
cph = "cph.main:app"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"
